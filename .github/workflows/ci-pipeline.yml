
name: Node.js Express API CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t devops-nodejs-api:v1.0 .

      - name: Run Docker container
        run: docker run -d --name devops-api-test -p 3000:3000 devops-nodejs-api:v1.0

      - name: Test health endpoint
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-api-test
          exit 1

      - name: Test root endpoint
        run: curl -fsS http://localhost:3000/
